name: Publish JetBrains plugin

on:
  push:
    tags:
      - 'jetbrains-v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/jetbrains-plugin

jobs:
  publish:
    runs-on: ubuntu-latest
    # Job-level env: build.gradle.kts reads these via
    # providers.environmentVariable(...), and publishPlugin depends on
    # signPlugin — so the signing variables must be visible to every Gradle
    # invocation, not just a dedicated signing step. (This also sidesteps the
    # `secrets` context being unavailable in `if:` conditions.)
    env:
      CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify release secrets are configured
        # Fail fast with the exact list of missing secrets instead of dying
        # halfway through signing or publishing. PRIVATE_KEY_PASSWORD is
        # intentionally not required: it only exists for encrypted keys.
        # if-blocks, not `[ -z ... ] && ...`: the workflow shell runs with
        # `bash -e`, where a false test as the head of an AND-list fails the
        # whole step even though nothing is wrong.
        run: |
          missing=()
          if [ -z "$CERTIFICATE_CHAIN" ]; then missing+=(JETBRAINS_CERTIFICATE_CHAIN); fi
          if [ -z "$PRIVATE_KEY" ]; then missing+=(JETBRAINS_PRIVATE_KEY); fi
          if [ -z "$PUBLISH_TOKEN" ]; then missing+=(JETBRAINS_MARKETPLACE_TOKEN); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag matches plugin version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#jetbrains-v}"
          plugin_version="$(grep -oP '(?<=^version = ")[^"]+' build.gradle.kts)"
          if [ "$tag_version" != "$plugin_version" ]; then
            echo "Tag jetbrains-v$tag_version does not match build.gradle.kts version $plugin_version"
            exit 1
          fi
      - run: ./gradlew build
      - run: ./gradlew signPlugin
      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin
