name: Publish JetBrains plugin

on:
  push:
    tags:
      - 'jetbrains-v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/jetbrains-plugin

jobs:
  publish:
    runs-on: ubuntu-latest
    # NOTE on secret naming: the only secret currently configured is
    # JETBRAINS_PRIVATE_KEY, but its value is actually a Marketplace API
    # token (from plugins.jetbrains.com -> My Tokens), not a code-signing
    # private key — no real signing key/certificate is configured. So this
    # workflow publishes unsigned: JetBrains recommends signing plugins, but
    # doesn't require it to publish. If a real signing key gets added later,
    # rename this secret (e.g. to JETBRAINS_MARKETPLACE_TOKEN) first to avoid
    # colliding with the real JETBRAINS_PRIVATE_KEY, then reintroduce a
    # signPlugin step reading JETBRAINS_CERTIFICATE_CHAIN/_PRIVATE_KEY.
    env:
      PUBLISH_TOKEN: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify release secrets are configured
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Missing repository secret: JETBRAINS_PRIVATE_KEY (holds the Marketplace token)"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify tag matches plugin version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#jetbrains-v}"
          plugin_version="$(grep -oP '(?<=^version = ")[^"]+' build.gradle.kts)"
          if [ "$tag_version" != "$plugin_version" ]; then
            echo "Tag jetbrains-v$tag_version does not match build.gradle.kts version $plugin_version"
            exit 1
          fi
      - run: ./gradlew build
      - name: Publish to JetBrains Marketplace
        # Unsigned build: no signing key is configured (see the job env
        # note above). Signing is recommended by JetBrains, not required.
        run: ./gradlew publishPlugin
