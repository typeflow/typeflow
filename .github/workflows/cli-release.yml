name: Release CLI

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release secrets are configured
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Missing repository secret: NPM_TOKEN (npmjs.org automation token — the @typeflowjs org doesn't exist yet, this workflow stays dormant until it does)"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Test
        run: bun test

      # `typeflowjs` and `@typeflowjs/converters` are marked external by
      # apps/cli/scripts/build.ts's bundler config, so this never touches the
      # repo-root postinstall symlink hack (scripts/link-local-deps.ts) —
      # only apps/cli's own dependency (commander) needs installing.
      - name: Install CLI dependencies
        run: bun install --frozen-lockfile --cwd apps/cli

      - name: Bump version
        id: version
        working-directory: apps/cli
        run: |
          npm version ${{ inputs.bump }} --no-git-tag-version
          echo "value=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Commit & tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/cli/package.json apps/cli/bun.lock
          git commit -m "chore(cli): release v${{ steps.version.outputs.value }}"
          git tag -a cli-v${{ steps.version.outputs.value }} -m "cli-v${{ steps.version.outputs.value }}"
          git push origin main --follow-tags

      - name: Build
        run: bun run --cwd apps/cli build

      - name: Setup Node registry
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Create GitHub Release
        run: |
          gh release create cli-v${{ steps.version.outputs.value }} \
            --title "cli-v${{ steps.version.outputs.value }}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
