name: Publish @typeflow/cli

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify release secrets are configured
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Missing repository secret: NPM_TOKEN (npmjs.org automation token — the @typeflow org doesn't exist yet, this workflow stays dormant until it does)"
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # `typeflow-js` and `@typeflow/converters` are marked external by
      # apps/cli/scripts/build.ts's bundler config, so this build never
      # touches the repo-root postinstall symlink hack (scripts/link-local-deps.ts)
      # — only apps/cli's own dependency (commander) needs installing.
      - run: bun install --frozen-lockfile --cwd apps/cli
      - name: Verify tag matches package version
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#cli-v}"
          pkg_version="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag cli-v$tag_version does not match apps/cli/package.json version $pkg_version"
            exit 1
          fi
      - run: bun run --cwd apps/cli build
      - name: Publish to npm
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
