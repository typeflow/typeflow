name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - # build (root lib) + lint + format:check + bun test
        run: bun run check
      - run: bun run typecheck
      - run: bun scripts/check-examples.ts check
      - run: bun scripts/check-examples.ts types --check
