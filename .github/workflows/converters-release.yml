name: Publish @typeflow/converters

on:
  push:
    tags:
      - 'converters-v*'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/converters

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify release secrets are configured
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Missing repository secret: NPM_TOKEN (npmjs.org automation token — the @typeflow org doesn't exist yet, this workflow stays dormant until it does)"
            exit 1
          fi
      - name: Verify tag matches package.json, Cargo.toml and optionalDependencies
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#converters-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          crate_version="$(grep -oP '(?<=^version = ")[^"]+' Cargo.toml)"
          if [ "$tag_version" != "$pkg_version" ] || [ "$tag_version" != "$crate_version" ]; then
            echo "::error::Tag converters-v$tag_version must match both package.json ($pkg_version) and Cargo.toml ($crate_version)"
            exit 1
          fi
          mismatched="$(node -p "
            const pkg = require('./package.json');
            Object.entries(pkg.optionalDependencies || {})
              .filter(([, v]) => v !== '$tag_version')
              .map(([n, v]) => n + '@' + v)
              .join(', ')
          ")"
          if [ -n "$mismatched" ]; then
            echo "::error::optionalDependencies out of sync with tag converters-v$tag_version: $mismatched"
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Tier 1 — native runners, no cross-toolchain risk. Broader Linux
          # arm64/musl and Windows arm64 coverage is a deliberately deferred
          # follow-up (needs zig/cross toolchains, unverifiable from a plain
          # dev machine) — see the napi.triples.additional list in
          # package.json for the currently-supported set.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx napi build --platform --release --target ${{ matrix.target }} --dts native-bindings.d.ts --js native-bindings.js
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: apps/converters/*.node

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: apps/converters/artifacts
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Assemble per-platform packages
        run: bunx napi artifacts
      - name: Sync per-platform package versions
        run: bunx napi version
      - run: bun run build
      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/*/; do
            (cd "$dir" && npm publish --access public)
          done
      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
