[package]
name = "typeflow-converters"
version = "0.0.1"
edition = "2021"
description = "Typeflow converters (jq / JSONata to Typeflow) as a native Node.js addon"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
rayon = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
